<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainwind - Stop styling pixels. Start styling synapses.</title>
    <meta name="description" content="Brainwind is a semantic markup pattern for creating Relational HTML that transforms flat prose into machine-readable knowledge graphs.">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        
        h1 { 
            color: #1e293b;
            border-bottom: 3px solid #3b82f6;
            padding-bottom: 0.5rem;
        }
        
        h2 {
            color: #334155;
            margin-top: 2rem;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 0.3rem;
        }
        
        h3 { color: #475569; }
        
        code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.9em;
        }
        
        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
        }
        
        pre code {
            background: none;
            color: inherit;
            padding: 0;
        }
        
        a {
            color: #3b82f6;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        blockquote {
            border-left: 4px solid #3b82f6;
            padding-left: 1rem;
            margin-left: 0;
            color: #64748b;
            background: #f8fafc;
            padding: 1rem;
            border-radius: 4px;
        }
        
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 1rem 0;
        }
        
        th, td {
            border: 1px solid #e2e8f0;
            padding: 0.75rem;
            text-align: left;
        }
        
        th {
            background: #f8fafc;
            font-weight: 600;
        }
        
        hr {
            border: none;
            border-top: 2px solid #e2e8f0;
            margin: 2rem 0;
        }
        
        ul, ol {
            padding-left: 1.5rem;
        }
        
        li {
            margin: 0.5rem 0;
        }
        
        #loading {
            text-align: center;
            padding: 4rem;
            color: #64748b;
        }
        
        .emoji {
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div id="loading">Loading...</div>
    <div id="content"></div>
    
    <script>
        // Fetch and render README.md
        fetch('README.md')
            .then(response => response.text())
            .then(markdown => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').innerHTML = marked.parse(markdown);
            })
            .catch(error => {
                document.getElementById('loading').innerHTML = 
                    '<h1>🧠 Brainwind</h1>' +
                    '<p>Error loading README.md. Please visit the ' +
                    '<a href="https://github.com/calistrum/brainwind">GitHub repository</a>.</p>';
            });
    </script>
</body>
</html>
